spring:
  application.name: alm-system
  datasource:
    url: ${ALM_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ALM_DB_USERNAME:alm}
    password: ${ALM_DB_PASSWORD:alm}
    driver-class-name: oracle.jdbc.OracleDriver
  jackson:
    default-property-inclusion: non_null
server:
  error.include-message: always
  servlet.context-path: /alm
